<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ size }}px;height:{{ size }}px;font-size:{{ fs }}px;flex:none;">
<sc-if value="{{ isChignon }}"><div style="position:absolute;left:3.3em;top:-0.1em;width:3.4em;height:3.4em;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5) 0, rgba(255,255,255,0) 45%), {{ c }};box-shadow:inset -0.3em -0.4em 0 {{ d }};"></div></sc-if>
<div style="position:absolute;left:0.6em;top:1.1em;width:8.8em;height:8.6em;border-radius:50%;background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.65) 0, rgba(255,255,255,0) 40%), {{ c }};box-shadow:inset -0.45em -0.65em 0 {{ d }}, 0 0.45em 0.8em rgba(70,40,20,.22);"></div>
<div style="position:absolute;left:2.05em;top:6.15em;width:1.3em;height:0.8em;border-radius:50%;background:rgba(255,80,80,.3);"></div>
<div style="position:absolute;left:6.65em;top:6.15em;width:1.3em;height:0.8em;border-radius:50%;background:rgba(255,80,80,.3);"></div>
<div style="position:absolute;left:3.05em;top:4.75em;width:0.95em;height:1.15em;border-radius:50%;background:#2b2a3d;"><div style="position:absolute;left:0.2em;top:0.2em;width:0.35em;height:0.35em;border-radius:50%;background:#fff;"></div></div>
<div style="position:absolute;left:5.95em;top:4.75em;width:0.95em;height:1.15em;border-radius:50%;background:#2b2a3d;"><div style="position:absolute;left:0.2em;top:0.2em;width:0.35em;height:0.35em;border-radius:50%;background:#fff;"></div></div>
<div style="position:absolute;left:4.4em;top:6.35em;width:1.2em;height:0.6em;border-radius:0 0 0.7em 0.7em;background:#2b2a3d;"></div>
<sc-if value="{{ isTuque }}">
<div style="position:absolute;left:1.05em;top:0.5em;width:7.9em;height:3.4em;border-radius:4em 4em 0.8em 0.8em;background:#fff8ef;box-shadow:inset -0.3em -0.4em 0 #eadccb;"></div>
<div style="position:absolute;left:1.35em;top:2.1em;width:7.3em;height:0.6em;background:{{ d }};opacity:.85;"></div>
<div style="position:absolute;left:0.75em;top:3.3em;width:8.5em;height:1.2em;border-radius:0.7em;background:#f3e6d6;box-shadow:inset 0 -0.25em 0 #e2d2be;"></div>
<div style="position:absolute;left:4.1em;top:-0.4em;width:1.8em;height:1.8em;border-radius:50%;background:#fff8ef;box-shadow:inset -0.2em -0.25em 0 #eadccb;"></div>
</sc-if>
<sc-if value="{{ isCasquette }}">
<div style="position:absolute;left:1.4em;top:0.7em;width:7.2em;height:3.4em;border-radius:3.6em 3.6em 0.4em 0.4em;background:#2b2a3d;box-shadow:inset -0.3em -0.35em 0 #1b1a28;"></div>
<div style="position:absolute;left:4.5em;top:0.45em;width:1em;height:0.7em;border-radius:0.5em;background:#2b2a3d;"></div>
<div style="position:absolute;left:4.9em;top:3.3em;width:4.6em;height:1.05em;border-radius:0.2em 1em 1em 0.2em;background:#3b3a52;"></div>
</sc-if>
<sc-if value="{{ isCouronne }}">
<div style="position:absolute;left:2.9em;top:0.15em;width:4.2em;height:2.4em;background:#d9a116;clip-path:polygon(0 100%,0 15%,22% 55%,50% 0,78% 55%,100% 15%,100% 100%);"></div>
<div style="position:absolute;left:2.9em;top:-0.1em;width:4.2em;height:2.4em;background:#ffd34d;clip-path:polygon(0 100%,0 15%,22% 55%,50% 0,78% 55%,100% 15%,100% 100%);"></div>
<div style="position:absolute;left:4.6em;top:1.2em;width:0.8em;height:0.8em;border-radius:50%;background:#ff6b4a;"></div>
</sc-if>
<sc-if value="{{ isLunettes }}">
<div style="position:absolute;left:2.55em;top:4.25em;width:1.95em;height:1.95em;border-radius:50%;border:0.32em solid #2b2a3d;box-sizing:border-box;background:rgba(255,255,255,.18);"></div>
<div style="position:absolute;left:5.5em;top:4.25em;width:1.95em;height:1.95em;border-radius:50%;border:0.32em solid #2b2a3d;box-sizing:border-box;background:rgba(255,255,255,.18);"></div>
<div style="position:absolute;left:4.45em;top:4.95em;width:1.1em;height:0.3em;background:#2b2a3d;"></div>
</sc-if>
<sc-if value="{{ isBandeau }}">
<div style="position:absolute;left:0.7em;top:2.75em;width:8.6em;height:1.25em;border-radius:0.6em;background:#fff8ef;box-shadow:inset 0 -0.25em 0 #eadccb;transform:rotate(-7deg);"></div>
<div style="position:absolute;left:8.2em;top:1.7em;width:1.1em;height:1.1em;border-radius:50%;background:#fff8ef;box-shadow:inset -0.2em -0.2em 0 #eadccb;"></div>
<div style="position:absolute;left:8.9em;top:2.4em;width:0.9em;height:0.9em;border-radius:50%;background:#fff8ef;box-shadow:inset -0.2em -0.2em 0 #eadccb;"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;char&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tuque&quot;,&quot;lunettes&quot;,&quot;couronne&quot;,&quot;casquette&quot;,&quot;chignon&quot;,&quot;bandeau&quot;],&quot;default&quot;:&quot;tuque&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;coral&quot;,&quot;blue&quot;,&quot;yellow&quot;,&quot;teal&quot;,&quot;violet&quot;,&quot;rose&quot;],&quot;default&quot;:&quot;coral&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;min&quot;:24,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;}}">
const AV_COL={coral:['#ff7a5c','#e0532f'],blue:['#5b8aff','#3b64dc'],yellow:['#ffcd4a','#e0a51b'],teal:['#3ccdaa','#21a283'],violet:['#a68aff','#7f62e6'],rose:['#ff7db6','#de5592']};
class Component extends DCLogic {
  renderVals(){
    const size=Number(this.props.size??64);
    const ch=this.props.char??'tuque';
    const [c,d]=AV_COL[this.props.color]||AV_COL.coral;
    return {size,fs:size/10,c,d,isTuque:ch==='tuque',isCasquette:ch==='casquette',isCouronne:ch==='couronne',isLunettes:ch==='lunettes',isBandeau:ch==='bandeau',isChignon:ch==='chignon'};
  }
}
</script>
</body>
</html>
